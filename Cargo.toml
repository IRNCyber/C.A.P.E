[workspace]
resolver = "2"
members = [
  "crates/attribution-record", "crates/pqc-core", "crates/crypt-engine",
  "crates/watermark", "crates/ledger", "crates/forensics",
  "bin/sender-cli", "bin/recipient-cli", "bin/forensic-cli", "bin/cape-ui",
]

[package]
name = "cape-e2e"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
attribution-record = { path = "crates/attribution-record" }
blake3.workspace = true
crypt-engine = { path = "crates/crypt-engine" }
forensics = { path = "crates/forensics" }
ledger = { path = "crates/ledger" }
pqc-core = { path = "crates/pqc-core" }
rand.workspace = true
tempfile = "3.13"
watermark = { path = "crates/watermark" }

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
bincode = "1.3"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
hex = "0.4"
hkdf = "0.12"
pqcrypto-mlkem = "0.1"
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
sled = "0.34"
thiserror = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
